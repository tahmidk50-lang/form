<!DOCTYPE html>
<html>
<head>
    <title>View Students</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">Student Manager</a>

    <div>
      <a href="index.html" class="btn btn-primary me-2">Add Student</a>
      <a href="view.html" class="btn btn-success">View Students</a>
    </div>
  </div>
</nav>

<!-- View Section -->
<div class="container mt-4">
    <h2>View Students</h2>

    <input type="text" id="key" class="form-control mb-2" placeholder="Storage Key">
    <button class="btn btn-success mb-3" onclick="loadData()">Load Data</button>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Student ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Course</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
function loadData() {

    let key = document.getElementById("key").value;
    let data = localStorage.getItem(key);

    let table = document.getElementById("tableBody");
    table.innerHTML = "";

    if (data == null) {
        alert("No data found!");
        return;
    }

    let arr = JSON.parse(data);

    arr.forEach(student => {
        let row = `
            <tr>
                <td>${student.id}</td>
                <td>${student.name}</td>
                <td>${student.email}</td>
                <td>${student.phone}</td>
                <td>${student.course}</td>
            </tr>
        `;
        table.innerHTML += row;
    });
}
</script>

</body>
</html>
